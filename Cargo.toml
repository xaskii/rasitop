[package]
name = "rasitop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.41"
clap = { version = "4.5.37", features = ["derive"] }
core-foundation = "0.10.1"
libc = "0.2.172"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.210", features = ["derive"] }
plist = "1.7.0"
serde_json = "1.0.145"
ctrlc = "3.5"

[dev-dependencies]
insta = "1.41.1"
