[project]
name = "rasitop-tools"
version = "0.1.0"
description = "Development and validation tools for rasitop recordings"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10.3",
]

[dependency-groups]
dev = [
  "pyrefly>=1.1.1",
]

[tool.uv]
package = false

[tool.pyrefly]
preset = "strict"
project-includes = ["scripts"]
search-path = ["scripts"]
